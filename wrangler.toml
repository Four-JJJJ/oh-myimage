name = "image-2-platform"
main = "src/worker/index.ts"
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[[d1_databases]]
binding = "DB"
database_name = "image-2-platform"
database_id = "replace-with-cloudflare-d1-database-id"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "image-2-images"

[[queues.producers]]
binding = "GENERATION_QUEUE"
queue = "image-2-generation"

[[queues.consumers]]
queue = "image-2-generation"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2

[vars]
DEFAULT_IMAGE_MODEL = "gpt-image-2"
MAX_IMAGES_PER_REQUEST = "4"
MAX_DAILY_JOBS_PER_SPACE = "50"
MAX_RUNNING_JOBS_PER_SPACE = "2"
REQUEST_TIMEOUT_MS = "120000"
IMAGE_RETENTION_DAYS = "90"
TURNSTILE_REQUIRED = "false"
TURNSTILE_SITE_KEY = ""
